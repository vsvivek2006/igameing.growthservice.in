<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="logo-purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6A0DAD" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="logo-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
    <filter id="glow-badge" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6A0DAD" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Hexagonal Brand Shield -->
  <g filter="url(#glow-badge)">
    <polygon points="50,12 82,30 82,70 50,88 18,70 18,30" fill="url(#logo-purple-grad)" />
    <polygon points="50,17 77,33 77,67 50,83 23,67 23,33" fill="#0F172A" />
  </g>

  <!-- Inner Golden Spark / Crown / Diamond Symbol -->
  <path d="M50 28 L58 42 L72 50 L58 58 L50 72 L42 58 L28 50 L42 42 Z" fill="url(#logo-gold-grad)" />
  <circle cx="50" cy="50" r="4" fill="#FFFFFF" />

  <!-- Brand Typography -->
  <text x="100" y="48" font-family="'Poppins', sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5" fill="#0F172A">
    iGAMEING
  </text>
  <text x="245" y="48" font-family="'Poppins', sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5" fill="url(#logo-purple-grad)">
    GROWTH
  </text>
  
  <rect x="102" y="58" width="22" height="3" rx="1.5" fill="url(#logo-gold-grad)" />
  <text x="130" y="66" font-family="'Inter', sans-serif" font-weight="600" font-size="10.5" letter-spacing="2.5" fill="#64748B">
    CASINO &amp; GAMING INTELLIGENCE
  </text>
</svg>
